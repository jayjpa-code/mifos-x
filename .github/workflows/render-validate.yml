name: Validate Render Fineract Deployment

on:
  push:
    branches:
      - dev
    paths:
      - render.yaml
      - Dockerfile
      - render-start.sh
      - .github/workflows/render-validate.yml
  pull_request:
    paths:
      - render.yaml
      - Dockerfile
      - render-start.sh
      - .github/workflows/render-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Render Blueprint schema
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          import jsonschema
          import yaml

          blueprint = yaml.safe_load(Path('render.yaml').read_text())
          with urllib.request.urlopen('https://render.com/schema/render.yaml.json') as response:
              schema = json.load(response)
          jsonschema.validate(instance=blueprint, schema=schema)
          print('Render Blueprint schema validation passed')
          PY

      - name: Build Fineract Render image
        run: docker build --pull -t korenxt-fineract-render:ci .
